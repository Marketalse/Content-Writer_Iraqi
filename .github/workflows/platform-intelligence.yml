name: Platform intelligence checks
on:
  push:
    branches: [feature/platform-intelligence-growth-engine, feature/ai-quality-review-and-revision]
  pull_request:
    paths:
      - "bot/**"
      - "knowledge/**"
      - "guidelines/**"
      - "tests/**"
      - "render.yaml"
      - ".github/workflows/platform-intelligence.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - name: Compile edited modules
        run: python -m compileall -q bot tests
      - name: Run no-network unit tests
        run: python -m unittest discover -s tests -v
