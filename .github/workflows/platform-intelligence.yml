name: Platform intelligence checks
on:
  push:
    branches: [main, feature/platform-intelligence-growth-engine, feature/ai-quality-review-and-revision]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r bot/requirements.txt
      - name: Compile edited modules
        run: python -m compileall -q bot tests
      - name: Verify audit fixes and full no-network suite
        run: python scripts/verify_fixes.py
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-fix-report
          path: test_reports/fixes/
