# Story and reel reply: the LinkedIn Hook / Content / CTA blocks, laid out as a timed script.
# Every line starts with a time range and a block label, then the fields separated by " | ".
# Reply only with these lines and an optional NOTE FOR OWNER line.

layout:
  - "[0-3s] HOOK | SPOKEN: ... | ON SCREEN: ..."
  - "[3-8s] CONTENT | SPOKEN: one intro sentence | ON SCREEN: ..."
  - "[8-14s] CONTENT | SPOKEN: 1. first point | ON SCREEN: ..."
  - "[14-20s] CONTENT | SPOKEN: 2. second point | ON SCREEN: ..."
  - "[20-25s] CONTENT | SPOKEN: 3. third point (the most important) | ON SCREEN: ..."
  - "[25-30s] CTA | SPOKEN: one line | ON SCREEN: ... | STICKER: ... (story only)"
  - "NOTE FOR OWNER: optional, never published"

rules:
  - "HOOK is the first line. CTA is the last block. Use the labels exactly: HOOK, CONTENT, CTA."
  - "Exactly three numbered points (1. 2. 3.) as SPOKEN lines under CONTENT."
  - "Hook SPOKEN: 7 words or fewer. Whole SPOKEN total: 75 words or fewer."
  - "ON SCREEN: 6 words or fewer per card."
  - "Story: the CTA line includes one STICKER. Reel: no sticker."
  - "No shot or camera descriptions. No greeting. No sign-off."
