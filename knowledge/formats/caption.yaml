# Final reply format for EVERY format (story, reel, carousel, LinkedIn). It is a text message with 8 lines,
# each starting with a fixed marker, in this exact order:
#   🎬 hook  ·  🔥 follow-up question  ·  🤔 the problem  ·  🎯 point 1  ·  💰 point 2  ·  📩 point 3  ·  🚀 CTA  ·  📊 options
# This overrides any timed script, storyboard, or labelled block format described above.
# No seconds, no SPOKEN / ON SCREEN, no Hook: / Content: / CTA: labels, no Keywords line.

layout:
  - {marker: "🎬", job: "The hook. 15 words or fewer. Stops the scroll: a claim or question about the reader's business."}
  - {marker: "🔥", job: "A follow-up question that makes the reader keep reading. 20 words or fewer."}
  - {marker: "🤔", job: "The problem, or the belief that is holding the reader back. 25 words or fewer."}
  - {marker: "🎯", job: "Point 1, starting with 'أول شي:'. 25 words or fewer."}
  - {marker: "💰", job: "Point 2, starting with 'ثاني شي:'. 25 words or fewer."}
  - {marker: "📩", job: "Point 3, starting with 'ثالث شي:'. The most important point. 25 words or fewer."}
  - {marker: "🚀", job: "The one call to action, as a question or a single ask. 20 words or fewer. Exactly one ask."}
  - {marker: "📊", job: "Options the reader can choose from, as a short either/or line. Story uses it as the interactive poll."}

rules:
  - "Exactly 8 non-empty lines, in the order above. A blank line between lines is allowed."
  - "Each line starts with its marker. No other lines before, between, or after them."
  - "Baghdadi, with گ and چ used naturally. No greeting, no sign-off, no hashtags unless the format allows them (carousel and reel: up to 5)."
  - "Figures are {{رقمك}} placeholders. Never invent numbers."
  - "NOTE FOR OWNER: optional, after the 8 lines. Never published."

example: |
  🎬 تنشر كل يوم وماكو مبيعات؟ 🤯

  🔥 كل يوم تنشر، بس محد يشتري منك؟ تدري ليش؟

  🤔 يمكن المشكلة مو بمنتجك ولا بسعرك… يمكن إنت دا تنشر بالمكان الغلط!

  🎯 أول شي: اختار منصة وحدة، المكان اللي زباينك فعلاً موجودين بيه.

  💰 ثاني شي: نزل منتج واحد، خلي سعره واضح، واطلب منهم يدزّولك رسالة.

  📩 ثالث شي: لا تنخدع باللايكات! احسب الرسائل الجدية، مو المشاهدات.

  🚀 هسه گلّي، من تجربتك وين يجيك زباين أكثر؟

  📊 تيك توك ⚡ لو إنستغرام؟ 📸
