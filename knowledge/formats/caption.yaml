# Final reply format for EVERY format (story, reel, carousel, LinkedIn).
# The reply is a labelled caption with three blocks, in this order: Hook, Content, CTA.
# This overrides any timed script or storyboard described above. Do not write seconds or SPOKEN/ON SCREEN lines.

output:
  labels_in_order: ["Hook:", "Content:", "CTA:"]
  hook: "A couple of words that grab attention so the reader keeps going. 15 words or fewer. A question, a surprise, or a sharp claim about the reader's business."
  content: "One intro line, then exactly 3 numbered points written as 1. 2. 3. Each point: a short title and at most one line of explanation. The 3rd point is the most important."
  cta: "One line, 25 words or fewer, with one clear reason to follow or act. It is the last line of the reply. Exactly one call to action."
  keywords: "Carousel and LinkedIn only: one line after the CTA, starting with Keywords:, with 3 to 6 search keywords separated by commas. No hashtags."
  owner_note: "Optional. After the CTA, a line starting with NOTE FOR OWNER: is shown only to the owner and is never published."

example: |
  Hook: تدري ليش مبيعاتك واكعة؟ تعرف سالفة الدولار شلون راح تأثر عليك؟

  Content:
  مبيعاتك حتى تزيدها انت تحتاج تنتبه لجهود التسويق، لان هاي 3 نقاط جداً مهمة، و3 نقطة اهم شي لازم تسويها:
  1. افهم العرض التسويقي
  2. ابني نص بيعي للعرض التسويقي يتناسب وي شخصيتك كبائع
  3. تواصل وي كل عملائك بشكل مستمر

  CTA: اذا ممتابعني بعدك ما اتصور، راح اطلعلك مرة ثانية.

# Source: ShareB, "Instagram Caption Strategy (2026)" (https://shareb.io/blog/instagram-caption-strategy)
hook_patterns:
  - "Most people get this wrong… (a belief the reader holds)"
  - "Nobody talks about this… (a hidden problem)"
  - "You're doing this wrong… (a direct challenge)"
  - "Have you experienced this? (a question about the reader's own situation)"
readability:
  - "Short lines. No paragraph longer than 60 words."
  - "Value first, promotion second: the useful content comes before the ask."
  - "One call to action only."

checks:
  hook_max_chars: {carousel: 125, linkedin: 210}
  total_words: {min: 40, max: 160}
  hashtags: {story: 0, linkedin: 0, reel: 5, carousel: 5}
  greeting: none
  invented_numbers: none
  numbered_points: 3
