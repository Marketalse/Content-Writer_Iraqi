[[lessons]]
id = "intent"
source = "funnel"
formats = ["all"]
text = "Match the next step to audience intent. Journey stages are non-linear; any format can serve different purposes. An email subscription is not a qualified sales inquiry."

[[lessons]]
id = "story_connection"
source = "stories"
formats = ["instagram_story", "tiktok_story"]
text = "A Story can be one moment or a connected teaching, poll, reveal, demonstration or referral sequence. Let the idea determine frame count; no mandatory three tips or sales ending."

[[lessons]]
id = "story_continuity"
source = "stories"
formats = ["instagram_story"]
text = "Ask meaningful questions. Give links useful context. Consider curating evergreen FAQs or work samples into Highlights and choose a sustainable cadence; these are strategy options, not ranking rules."

[[lessons]]
id = "video_components"
source = "translation"
formats = ["instagram_reel", "tiktok_video"]
text = "Distinguish spoken copy, visuals, overlays and caption context. Pay off the opening promise and respect supplied filming constraints. Repurpose the idea, not another format's layout."

[[lessons]]
id = "paid_copy"
source = "tiktok_ads"
formats = ["tiktok_video"]
distribution = "paid"
text = "For paid promotion, coordinate spoken action, overlay and actual destination. Use result, authority, testimonial, scarcity or urgency claims only when supported by supplied evidence. Do not invent a resource or delivery automation."

[[lessons]]
id = "repurposing"
source = "funnel"
formats = ["all"]
text = "Adapt supplied source material to each audience and format without treating repurposing as new research. Preserve factual meaning and creator voice. Match measurement to objective, not vanity counts."
